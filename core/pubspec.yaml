name: core
description: Shared core package used by all apps in this monorepo (theme, routing, services, cubits, utils).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  get_it: ^8.0.3
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  # MVP-OFFLINE: firebase commented out (offline-only MVP)
  # firebase_core: ^3.15.2
  # firebase_auth: ^5.7.0
  # cloud_firestore: ^5.6.12
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  go_router: ^15.1.3
  flutter_screenutil: ^5.9.3
  animate_do: ^4.2.0
  easy_localization: ^3.0.7
  # MVP-OFFLINE: connectivity commented out (offline-only MVP)
  # connectivity_plus: ^6.1.5
  # internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  logger: ^2.5.0
  printing: ^5.13.4
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
