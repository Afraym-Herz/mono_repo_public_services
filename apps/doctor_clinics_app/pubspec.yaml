name: doctor_clinics_app
description: Doctor Clinics app — shares package:core in this monorepo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Shared core (theme / routing / services / cubits) ──
  core:
    path: ../../core

  # ── Directly imported in this app's bootstrap (must stay direct deps) ──
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^15.1.3
  easy_localization: ^3.0.7
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.6
  path: ^1.9.1
  # firebase_core: ^3.15.2  # MVP-OFFLINE: commented out (offline-only MVP)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
