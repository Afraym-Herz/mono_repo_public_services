name: monorepo
repository: https://example.com/monorepo

packages:
  - core
  - apps/*

scripts:
  bootstrap: melos exec -- flutter pub get
  analyze: melos exec -- flutter analyze
  format: melos exec -- dart format .
  test: melos exec -- flutter test
  get:core: melos exec --scope=core -- flutter pub get
  get:clinics: melos exec --scope=doctor_clinics_app -- flutter pub get
  run:clinics: melos exec --scope=doctor_clinics_app -- flutter run
  # Pinned web port + persistent Chrome profile dir. Web storage (Drift DB in
  # IndexedDB/OPFS + flutter_secure_storage in localStorage) is per-origin and
  # per-profile; without both of these, `flutter run -d chrome` starts from a
  # random port and a fresh temp profile every run, so the app looks like a
  # fresh install and forces sign-up again.
  run:clinics:chrome: melos exec --scope=doctor_clinics_app -- flutter run -d chrome --web-port=8080 --web-browser-flag=--user-data-dir=C:\flutter-web-profile
  build_runner:core: melos exec --scope=core -- dart run build_runner build --delete-conflicting-outputs
  create_app: powershell -ExecutionPolicy Bypass -File tool/create_app.ps1

command:
  bootstrap:
    runPubGetInParallel: true
    enforceLockfile: false
